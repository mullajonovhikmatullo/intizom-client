server {
    listen 80;
    server_name discip.uz www.discip.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://discip.uz$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name discip.uz www.discip.uz;

    ssl_certificate     /etc/letsencrypt/live/discip.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/discip.uz/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ {
        proxy_pass http://backend:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
