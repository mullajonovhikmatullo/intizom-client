server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only the host's Caddy reaches this port (via the Docker gateway); take the
    # client IP from its X-Forwarded-For so the API's per-IP rate limits work.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    # Resolve through Docker DNS at request time so a recreated backend
    # container (new IP) is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:4000;

    location /api/v1/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri /index.html;
    }
}
