    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Paint the page background before the main stylesheet loads, otherwise the
         browser shows its default white for a frame on every full load in dark mode.
         Keep in sync with --background in src/index.css. -->
    <style>
      html { background-color: hsl(240 20% 99%); }
      html.dark { background-color: hsl(0 0% 4%); color-scheme: dark; }
    </style>
    <script>
      try {
        var s = localStorage.getItem('ht.settings.v1');
        if (s && JSON.parse(s).theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
